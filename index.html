<!DOCTYPE html>
<html>
<head>
    <title>Jogo da Memória Infantil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="painel-controle">
        <div id="contador">Movimentos: 0</div>
        <select id="dificuldade">
            <option value="4">Fácil (4 pares)</option>
            <option value="6">Médio (6 pares)</option>
            <option value="8">Difícil (8 pares)</option>
        </select>
        <button id="reiniciar">🔁 Reiniciar</button>
    </div>

    <div id="jogo"></div>

    <div id="tela-vitoria" class="escondido">
        <div class="conteudo-vitoria">
            🎉 Parabéns! 🎉
            <p>Você completou em <span id="movimentos-final">0</span> movimentos!</p>
            <button id="jogar-novamente">Jogar novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
